name: Render Pulse issues

on:
  push:
    branches: [main]
    paths:
      - "data/**.json"
      - "templates/**"
      - "scripts/render_issue.py"
      - ".github/workflows/render.yml"
  workflow_dispatch:
    inputs:
      sync_site:
        description: "Also sync index/archive/nav"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: render-pulse
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Render all data JSON
        run: |
          if compgen -G "data/????-??-??.json" > /dev/null; then
            python3 scripts/render_issue.py --all --sync-site
          else
            echo "No data/*.json yet — skip render"
          fi

      - name: Commit rendered site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add issues data templates scripts index.html archive.html about.html topics "*.html" || true
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "ci: render Pulse issues from data JSON"
            git push
          fi
